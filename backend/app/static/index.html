<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Quick Filler</title>
  <style>
    :root {
  font-family: Inter, Arial, sans-serif;
  color: #17223b;
  background: #f4f7fb;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
}

header {
  padding: 28px;
  color: #ffffff;
  background: linear-gradient(135deg, #112a59, #1f4b99);
  box-shadow: 0 4px 18px #10285830;
}

header strong {
  display: block;
  margin-bottom: 4px;
  font-size: 1.45rem;
  letter-spacing: -0.02em;
}

main {
  max-width: 1500px;
  margin: auto;
  padding: 28px 22px;
}

.upload,
.panel {
  background: #ffffff;
  border: 1px solid #d9e1ef;
  border-radius: 14px;
  box-shadow: 0 8px 24px #17377212;
}

.upload {
  padding: 20px;
}

.upload form {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

button,
select,
input {
  min-height: 42px;
  padding: 10px 12px;
  border: 1px solid #b8c5d8;
  border-radius: 8px;
  font: inherit;
}

input[type="file"] {
  max-width: 320px;
  background: #f9fbff;
}

select {
  background: #ffffff;
  color: #17223b;
}

button {
  border: 1px solid #173772;
  background: #173772;
  color: #ffffff;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.15s ease, background 0.15s ease;
}

button:hover {
  background: #102a5c;
  transform: translateY(-1px);
}

.status {
  min-height: 30px;
  padding: 6px 10px;
  border-radius: 999px;
  font-weight: 700;
  color: #173772;
  background: #eaf1ff;
}

.status:empty {
  display: none;
}

.grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 20px;
  margin-top: 20px;
}

.hidden {
  display: none;
}

.panel {
  padding: 20px;
}

.panel h2 {
  margin: 0 0 10px;
  font-size: 1.1rem;
}

iframe {
  width: 100%;
  height: 72vh;
  border: 1px solid #d9e1ef;
  border-radius: 8px;
}

textarea {
  width: 100%;
  min-height: 60vh;
  padding: 14px;
  border: 1px solid #b8c5d8;
  border-radius: 8px;
  background: #0f1d36;
  color: #eaf1ff;
  font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
  font-size: 13px;
  line-height: 1.5;
  resize: vertical;
}

.warning {
  margin: 0 0 12px;
  color: #7a5700;
}

.warnings {
  margin: 12px 0;
  padding: 14px;
  border: 1px solid #e3bd55;
  border-radius: 8px;
  color: #624700;
  background: #fff8df;
}

.warnings ul {
  margin: 8px 0 0;
  padding-left: 20px;
}

.actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 12px;
}

.actions button[data-format] {
  border-color: #b8c5d8;
  color: #173772;
  background: #ffffff;
}

.actions button[data-format]:hover {
  background: #eaf1ff;
}

@media (max-width: 900px) {
  main {
    padding: 18px 14px;
  }

  .grid {
    grid-template-columns: 1fr;
  }

  iframe {
    height: 55vh;
  }
}
  </style>
</head>
<body><header><strong>Quick Filler</strong> - revisão de transcrições</header><main>
  <section class="upload"><form id="form"><input type="file" name="arquivo" accept="application/pdf" required>
    <select name="tipo"><option value="cartao-ponto">Cartão de ponto</option><option value="holerite">Holerite</option></select>
    <button>Processar PDF</button><span id="status" class="status"></span></form></section>
  <section id="workspace" class="grid hidden"><div class="panel"><h2>Documento</h2><iframe id="pdf"></iframe></div>
    <div class="panel"><h2>Transcrição editável</h2><p class="warning">Use <code>?</code> quando um caractere não puder ser confirmado.</p> 
      <div id="warnings" class="warnings hidden"></div>
      <textarea id="editor" spellcheck="false"></textarea><div class="actions"><button id="save">Salvar correções</button>
      <button data-format="xlsx">Baixar XLSX</button><button data-format="csv">Baixar CSV</button><button data-format="json">Baixar JSON</button></div></div></section>
<script>
let id = null;
const status = document.querySelector("#status");
const editor = document.querySelector("#editor");
const warningBox = document.querySelector("#warnings");

function renderWarnings(warnings) {
  warningBox.replaceChildren();

  if (!warnings?.length) {
    warningBox.classList.add("hidden");
    return;
  }

  const title = document.createElement("strong");
  title.textContent = "Revisão recomendada";

  const list = document.createElement("ul");

  for (const warning of warnings) {
    const item = document.createElement("li");
    const location = warning.row == null
      ? `Página ${warning.page}`
      : `Página ${warning.page}, linha ${warning.row + 1}`;

    item.textContent = `${location}: ${warning.message}`;
    list.append(item);
  }

  warningBox.append(title, list);
  warningBox.classList.remove("hidden");
}
document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();status.textContent='Enviando...';
 const response=await fetch('/api/transcricoes',{method:'POST',body:new FormData(e.target)});if(!response.ok){status.textContent=await response.text();return}
 id=(await response.json()).id;status.textContent='Processando...';poll();});
async function poll(){const data=await (await fetch(`/api/transcricoes/${id}`)).json();status.textContent=data.status;
 if(data.status==='processando'){setTimeout(poll,1000);return}if(data.status==='erro'){status.textContent=data.erro;return}
 editor.value = JSON.stringify(data.value, null, 2);
 renderWarnings(data.warnings);document.querySelector('#pdf').src=`/api/transcricoes/${id}/pdf`;
 document.querySelector('#workspace').classList.remove('hidden');}
document.querySelector("#save").addEventListener("click", async () => {
  try {
    const value = JSON.parse(editor.value);

    const response = await fetch(`/api/transcricoes/${id}`, {
      method: "PUT",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({value}),
    });

    if (!response.ok) {
      throw Error(await response.text());
    }

    const data = await response.json();
    renderWarnings(data.warnings);
    status.textContent = "Correções salvas";
  } catch (error) {
    status.textContent = "JSON inválido: " + error.message;
  }
});

document.querySelectorAll("[data-format]").forEach((button) => {
  button.addEventListener("click", () => {
    window.location =
      `/api/transcricoes/${id}/planilha?formato=${button.dataset.format}`;
  });
});
</script>
</main>
</body>
</html>
